<title>Fluxo Inglês</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Layout: caderno de campo de engenheiro — fundo de prancha com grade azul,
   tinta navy, anotações em bronze, e ciano-água para tudo o que fala ou escuta. */
:root{
  --paper:#F2F5F7; --sheet:#FFFFFF; --sheet-2:#F7F9FA;
  --ink:#142536; --ink-2:#4B5E71; --ink-3:#7C8C9C;
  --line:#D6DEE5; --grid:rgba(20,37,54,.045);
  --bronze:#86602F; --bronze-soft:#F3E9DA;
  --water:#0B88A8; --water-hi:#5FD0EA; --water-soft:#DCF0F6;
  --stage:#132A3F; --stage-2:#1B3A55; --on-stage:#E9F2F8; --on-stage-2:#A9C2D6;
  --hat:#E9A93A; --hat-dk:#B9802A; --face:#10202F;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --warn:#A86F12; --warn-soft:#FBEFD9; --bad:#B23A3A; --bad-soft:#F8E3E3;
  --shadow:0 1px 2px rgba(20,37,54,.06),0 6px 18px rgba(20,37,54,.06);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --nav-h:64px; --top-h:52px; --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1620; --sheet:#132130; --sheet-2:#172738;
    --ink:#E6EEF5; --ink-2:#A3B5C6; --ink-3:#71869A;
    --line:#26394C; --grid:rgba(230,238,245,.035);
    --bronze:#DDB47A; --bronze-soft:#2B2418;
    --water:#3DC1E0; --water-hi:#8EE3F4; --water-soft:#0F2F3A;
    --stage:#08121C; --stage-2:#102233; --on-stage:#E6EEF5; --on-stage-2:#93ABBF;
    --hat:#E9A93A; --hat-dk:#B9802A; --face:#0E1C29;
    --ok:#5CC48B; --ok-soft:#14301F; --warn:#E5B451; --warn-soft:#33270F; --bad:#F07878; --bad-soft:#3A1818;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1620; --sheet:#132130; --sheet-2:#172738;
  --ink:#E6EEF5; --ink-2:#A3B5C6; --ink-3:#71869A;
  --line:#26394C; --grid:rgba(230,238,245,.035);
  --bronze:#DDB47A; --bronze-soft:#2B2418;
  --water:#3DC1E0; --water-hi:#8EE3F4; --water-soft:#0F2F3A;
  --stage:#08121C; --stage-2:#102233; --on-stage:#E6EEF5; --on-stage-2:#93ABBF;
  --hat:#E9A93A; --hat-dk:#B9802A; --face:#0E1C29;
  --ok:#5CC48B; --ok-soft:#14301F; --warn:#E5B451; --warn-soft:#33270F; --bad:#F07878; --bad-soft:#3A1818;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-l{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grow{flex:1;min-width:0}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{height:var(--top-h);display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.02em}
.brand svg{width:26px;height:28px}
.brand small{font-weight:500;color:var(--bronze);font-size:1rem}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--sheet)}
.icon-btn svg{width:22px;height:22px}
.engine{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-2);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);white-space:nowrap}
.engine i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:block}
.engine[data-s="claude"] i,.engine[data-s="key"] i{background:var(--ok)}
.engine[data-s="loading"] i{background:var(--warn)}

/* Main */
main{max-width:760px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px)}
body.typing main{padding-bottom:16px}
.view{display:flex;flex-direction:column;gap:18px}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--ink-3);position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--bronze)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--water);color:#fff;font-size:.66rem;display:grid;place-items:center}
body.typing .tabs{display:none}

/* Surfaces */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.flat{border-top:1px solid var(--line);padding-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font-weight:600;color:var(--ink);text-decoration:none}
.btn svg{width:19px;height:19px;flex:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.water{background:var(--water);border-color:var(--water);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg{display:flex;background:var(--sheet-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;padding:0 10px;font-weight:600;font-size:.86rem;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.tag{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--bronze-soft);color:var(--bronze)}
.code{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--sheet-2);border:1px solid var(--line);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font-weight:400}
textarea{resize:vertical;min-height:88px}
.olist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.olist a{color:var(--water);font-weight:600}
details summary{cursor:pointer}
.note{font-size:.86rem;color:var(--ink-2);background:var(--sheet-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.warnbox{font-size:.9rem;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink);border-radius:12px;padding:12px}
.errbox{font-size:.9rem;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:12px;padding:12px}

/* Phrase (EN / leitura / PT) — a regra de apresentação do Jorge */
.ph{display:flex;flex-direction:column;gap:3px;min-width:0}
.ph .en{font-weight:600;font-size:1.12rem;line-height:1.3;color:var(--ink)}
.ph .en b{font-weight:700;text-decoration:underline;text-decoration-color:var(--bronze);text-decoration-thickness:2px;text-underline-offset:3px}
.ph .rd{font-style:italic;color:var(--bronze);font-size:1rem}
.ph .rd b{font-style:normal;font-weight:700}
.ph .pt{color:var(--ink-2);font-size:.95rem}
.ph.xl .en{font-family:var(--f-display);font-size:2.3rem;line-height:1.05;letter-spacing:.005em}
.ph.xl .rd{font-size:1.25rem}
.ph.xl .pt{font-size:1.05rem}
.ph.l .en{font-size:1.35rem}
.say{display:flex;gap:6px;flex-wrap:wrap}
.say button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);font-size:.82rem;font-weight:600;color:var(--water)}
.say button svg{width:17px;height:17px}
.ph-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ph-row > .ph,.dlg-line > .ph{flex:1}
.ph-row + .ph-row{border-top:1px solid var(--line);padding-top:12px}
.hide-pt .pt{display:none}

/* Home */
.daycard{position:relative;overflow:hidden}
.daycard::after{content:"";position:absolute;right:-46px;bottom:-46px;width:150px;height:150px;border-radius:50%;border:16px solid var(--water-soft);opacity:.7;pointer-events:none}
.daycard > *{position:relative;z-index:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink-2)}
.meter{height:8px;background:var(--sheet-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bronze);border-radius:6px;transition:width .4s}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);min-height:96px}
.qa svg{width:24px;height:24px;color:var(--water)}
.qa[disabled]{opacity:.55;cursor:default}
.qa b{font-size:1rem}
.qa span{font-size:.8rem;color:var(--ink-2)}
.continue{display:flex;gap:14px;align-items:center}

/* Call */
.stage{background:radial-gradient(120% 90% at 50% 0%,var(--stage-2),var(--stage));color:var(--on-stage);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.stage .meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--on-stage-2)}
.stage .status{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-stage)}
.stage .missions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stage .missions span{font-size:.76rem;padding:4px 10px;border-radius:999px;border:1px solid var(--stage-2);background:rgba(255,255,255,.06);color:var(--on-stage-2)}
.stage .missions span.ok{background:rgba(92,196,139,.18);border-color:rgba(92,196,139,.6);color:var(--on-stage)}
.gota{position:relative;width:132px;height:142px;display:grid;place-items:center}
.gota svg{width:120px;height:130px;position:relative;z-index:2}
.gota .ring{position:absolute;left:50%;top:58%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid var(--water-hi);opacity:0;z-index:1}
.gota[data-state="listening"] .ring{animation:ripple 1.8s ease-out infinite}
.gota[data-state="listening"] .ring:nth-child(2){animation-delay:.6s}
.gota[data-state="listening"] .ring:nth-child(3){animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.gota .eyes{transform-origin:60px 82px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.gota[data-state="speaking"] .mouth{transform-origin:60px 97px;animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.6)}to{transform:scaleY(1.5)}}
.gota .think{position:absolute;top:2px;right:6px;display:none;gap:4px;z-index:3}
.gota .think i{width:7px;height:7px;border-radius:50%;background:var(--on-stage);opacity:.3;animation:dot 1s infinite}
.gota .think i:nth-child(2){animation-delay:.2s}.gota .think i:nth-child(3){animation-delay:.4s}
.gota[data-state="thinking"] .think{display:flex}
@keyframes dot{50%{opacity:1;transform:translateY(-3px)}}
.gota[data-state="thinking"] svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

.log{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;display:flex;flex-direction:column;gap:8px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:16px 16px 4px 16px}
.msg.t{align-self:flex-start;background:var(--sheet);border:1px solid var(--line);padding:12px 14px;border-radius:16px 16px 16px 4px;box-shadow:var(--shadow)}
.fix{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fix .was{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--ink-2);font-size:.92rem}
.fix .why{font-size:.9rem}
.tip{font-size:.88rem;color:var(--ink-2);border-left:3px solid var(--water);padding-left:10px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words button{font-size:.8rem;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:4px 8px;color:var(--ink-2)}
.words button.added{border-style:solid;border-color:var(--ok);color:var(--ok)}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:15;display:flex;gap:8px;align-items:flex-end;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
body.typing .composer{bottom:8px}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:140px;border:0;background:transparent;padding:10px 6px;resize:none}
.composer textarea:focus{outline:none}
.mic{width:48px;height:48px;border-radius:14px;border:0;background:var(--water);color:#fff;display:grid;place-items:center;flex:none}
.mic svg{width:24px;height:24px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--water) 25%,transparent)}}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px}
.dictate{font-size:.82rem;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.dictate svg{width:18px;height:18px;flex:none;color:var(--water);margin-top:2px}

/* Score */
.score{display:flex;flex-wrap:wrap;gap:4px 6px;font-weight:600;font-size:1.1rem}
.score span{padding:1px 6px;border-radius:6px}
.score .ok{background:var(--ok-soft);color:var(--ok)}
.score .close{background:var(--warn-soft);color:var(--warn)}
.score .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.pct{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.repeat{border:1px solid var(--water);background:var(--water-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Trail */
.file{display:flex;flex-direction:column;gap:8px}
.file-h{display:flex;align-items:baseline;gap:10px}
.file-h .num{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1;color:var(--bronze);font-variant-numeric:tabular-nums}
.lesson{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);text-align:left;width:100%}
.lesson .grow b{display:block;font-size:.98rem}
.lesson .grow span{display:block;font-size:.8rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson.pe .code{background:var(--water-soft);color:var(--water);border-color:transparent}
.lesson.rv .code{background:var(--bronze-soft);color:var(--bronze);border-color:transparent}
.lesson.here{border-color:var(--bronze);box-shadow:0 0 0 2px var(--bronze-soft)}
.st{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.st.half{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.st.done{border-color:var(--ok);background:var(--ok)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.steps button{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;min-height:36px;padding:0 12px;font-size:.84rem;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.steps button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps button.done::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.q{display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);font-weight:600}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border-radius:12px;border:1.5px dashed var(--line)}
.tiles button{border:1px solid var(--line);background:var(--sheet-2);border-radius:9px;min-height:38px;padding:0 12px;font-weight:600}
.feedback{border-radius:12px;padding:10px 12px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.feedback.good{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.feedback.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.progress-line{display:flex;gap:4px}
.progress-line i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-line i.ok{background:var(--ok)} .progress-line i.bad{background:var(--bad)} .progress-line i.cur{background:var(--ink)}

/* Review */
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;align-items:center}
.flash .ph{align-items:center}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{flex-direction:column;gap:0;min-height:56px;font-size:.92rem}
.grade .btn small{font-weight:500;color:var(--ink-3);font-size:.72rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);font-weight:600;padding:6px 10px}
.match button[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}
.match button.gone{visibility:hidden}
.match button.miss{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--water);transition:width 1s linear}
.errs{display:flex;flex-direction:column;gap:10px}
.err{display:flex;gap:12px;align-items:flex-start}
.err .n{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--bad);min-width:30px;font-variant-numeric:tabular-nums}

/* Lists */
.list{display:flex;flex-direction:column}
.list > *{padding:12px 0;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.sit{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sit > svg{width:24px;height:24px;flex:none;color:var(--water);margin-top:2px}
.code svg{width:22px;height:22px;color:var(--water)}
.sit .grow b{display:block}
.sit .grow span{font-size:.84rem;color:var(--ink-2)}
.modes{display:grid;grid-template-columns:1fr;gap:8px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px}
.mode[aria-pressed="true"]{border-color:var(--bronze);box-shadow:0 0 0 2px var(--bronze-soft)}
.mode .flow{width:52px;height:30px;flex:none;color:var(--water)}
.mode b{display:block}
.mode span{font-size:.84rem;color:var(--ink-2)}
.mode q{display:block;font-style:italic;font-size:.84rem;color:var(--bronze);margin-top:4px}
.photo-prev{max-height:280px;width:100%;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:var(--sheet-2)}
.dlg-line{display:flex;gap:10px;align-items:flex-start}
.who{font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;min-width:74px;padding-top:3px;color:var(--bronze)}
.who.j{color:var(--water)}
pre.clean{white-space:pre-wrap;font-family:var(--f-body);background:var(--sheet-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;font-size:.95rem}
.hist{display:flex;gap:12px;align-items:center}
.hist .d{font-family:var(--f-display);font-weight:600;color:var(--ink-3);min-width:46px;font-size:.9rem;font-variant-numeric:tabular-nums}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 12px;text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--water);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:20px 12px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Toast & sheet */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(8,18,28,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--sheet);border-radius:18px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);max-height:85vh;overflow:auto}
@media (min-width:640px){
  .quick{grid-template-columns:repeat(3,1fr)}
  .modes{grid-template-columns:repeat(3,1fr)}
  .ph.xl .en{font-size:2.8rem}
}
@media (max-width:380px){ .brand small{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

const KEY = 'fluxo.v1';
function defaults(){
  return {
    v:1, updatedAt:0,
    profile:{name:'Jorge', lessonId:'1A', mode:'laminar', pt:'apoio', rate:'normal', voice:'', goal:60, quality:'quick', autoSpeak:true},
    stats:{xp:{}, days:[]},
    cards:{}, errors:[], history:[], lessons:{}, phraseOffset:0, seeded:false
  };
}
function merge(base, inc){
  const out = {...base, ...inc};
  out.profile = {...base.profile, ...(inc.profile||{})};
  out.stats = {...base.stats, ...(inc.stats||{})};
  return out;
}
let S = (() => { try { const raw = localStorage.getItem(KEY); if (raw) return merge(defaults(), JSON.parse(raw)); } catch {} return defaults(); })();
function persistLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function save(){ S.updatedAt = Date.now(); persistLocal(); Sync.schedule(); }
const getKey = () => { try { return localStorage.getItem('fluxo.apikey') || ''; } catch { return ''; } };
const getWs = () => { try { return localStorage.getItem('fluxo.ws') || ''; } catch { return ''; } };
const setWs = k => { try { k ? localStorage.setItem('fluxo.ws', k) : localStorage.removeItem('fluxo.ws'); } catch {} };
const setKey = k => { try { k ? localStorage.setItem('fluxo.apikey', k) : localStorage.removeItem('fluxo.apikey'); } catch {} };

function compact(st){
  const c = JSON.parse(JSON.stringify(st));
  c.history = c.history.slice(0, 150); c.errors = c.errors.slice(0, 150);
  const days = Object.keys(c.stats.xp).sort().slice(-120); const xp = {}; days.forEach(d => xp[d] = c.stats.xp[d]); c.stats.xp = xp;
  c.stats.days = c.stats.days.slice(-400);
  if (c.stats.usage) { const u = {}; Object.keys(c.stats.usage).sort().slice(-60).forEach(d => u[d] = c.stats.usage[d]); c.stats.usage = u; }
  return c;
}
const Sync = {
  ref:null, lref:null, timer:null, busy:false, dirty:false, on:false,
  async init(){
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.ref = db.doc('data/users/' + uid + '/main');
      this.lref = this.ref.collection('lessons');
      const snap = await this.ref.get();
      const remote = snap.exists && snap.data().state ? JSON.parse(snap.data().state) : null;
      if (remote && (remote.updatedAt||0) > (S.updatedAt||0)) {
        S = merge(defaults(), remote); persistLocal(); render(); toast('Progresso sincronizado');
      } else if (!remote || (S.updatedAt||0) > (remote.updatedAt||0)) { this.schedule(); }
      this.on = true;
    } catch (e) { this.ref = null; }
  },
  schedule(){ if (!this.ref) return; this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 2500); },
  async flush(){
    if (!this.ref || this.busy || !this.dirty) return;
    this.busy = true; this.dirty = false;
    try { await this.ref.set({state: JSON.stringify(compact(S)), updatedAt: S.updatedAt}); }
    catch (e) { if (e && e.code === 'invalid_argument') this.ref = null; }
    this.busy = false; if (this.dirty) this.schedule();
  },
  async getLesson(id){ if (!this.lref) return null; try { const s = await this.lref.doc(id).get(); return s.exists ? JSON.parse(s.data().json) : null; } catch { return null; } },
  async putLesson(id, data){ if (!this.lref) return; try { await this.lref.doc(id).set({json: JSON.stringify(data), at: Date.now()}); } catch {} }
};

/* XP, ofensiva, cartões, erros, histórico */
function addXP(n){
  const d = today(); S.stats.xp[d] = (S.stats.xp[d]||0) + n;
  if (!S.stats.days.includes(d)) S.stats.days.push(d);
  save(); paintTabs();
}
function streak(){
  const set = new Set(S.stats.days); let d = today(); let n = 0;
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
const BOX = [0,1,2,4,7,15,30];
function addCard(p, src='aula'){
  if (!p || !p.en) return false;
  const id = hash(plain(p.en).toLowerCase());
  if (S.cards[id]) return false;
  S.cards[id] = {en:p.en, reading:p.reading||'', pt:p.pt||'', src, box:0, due:today(), added:today()};
  return true;
}
function dueCards(){ const t = today(); return Object.entries(S.cards).filter(([,c]) => c.due <= t).map(([id,c]) => ({id, ...c})); }
function gradeCard(id, g){
  const c = S.cards[id]; if (!c) return;
  if (g === 0) c.box = 0; else if (g === 1) c.box = Math.max(1, c.box); else c.box = Math.min(6, c.box + 1);
  c.due = addDays(today(), g === 0 ? 0 : BOX[c.box]);
}
function logError(fx){
  if (!fx || !fx.right) return;
  const k = plain(fx.right).toLowerCase();
  const e = S.errors.find(x => plain(x.right).toLowerCase() === k);
  if (e) { e.n++; e.last = today(); e.wrong = fx.wrong || e.wrong; }
  else S.errors.unshift({wrong:fx.wrong||'', right:fx.right, reading:fx.reading||'', pt:fx.pt||'', why:fx.why||'', n:1, last:today()});
  S.errors = S.errors.slice(0, 150);
  addCard({en:fx.right, reading:fx.reading, pt:fx.pt}, 'erro');
}
function logHistory(type, title, detail, xp){
  S.history.unshift({d:today(), at:Date.now(), type, title, detail:detail||'', xp:xp||0});
  S.history = S.history.slice(0, 150); save();
}
if (!S.seeded) { STARTER.forEach(p => addCard(p, 'inicial')); S.seeded = true; persistLocal(); }

const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [],
  init(){
    if (!this.ok) return;
    const load = () => { try { this.voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch {} };
    load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch {}
  },
  pick(prefFemale){
    const want = S.profile.voice;
    let v = this.voices.find(v => v.name === want);
    if (!v) v = this.voices.find(v => /en-US/i.test(v.lang) && /Google|Samantha|Aria|Jenny|Natural/i.test(v.name)) || this.voices.find(v => /en-US/i.test(v.lang)) || this.voices[0];
    return v || null;
  },
  speak(text, {slow=false, voice=null, onStart, onEnd}={}){
    if (!this.ok) { toast('Áudio indisponível nesta visualização'); return Promise.resolve(); }
    try { speechSynthesis.cancel(); } catch {}
    const parts = (plain(text).match(/[^.!?]+[.!?]*/g) || [plain(text)]).map(s => s.trim()).filter(Boolean);
    return new Promise(res => {
      let i = 0; onStart && onStart();
      const done = () => { onEnd && onEnd(); res(); };
      const next = () => {
        if (i >= parts.length) return done();
        const u = new SpeechSynthesisUtterance(parts[i++]);
        const v = voice || this.pick();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
        u.rate = slow ? 0.68 : (S.profile.rate === 'slow' ? 0.82 : 0.96);
        u.onend = next; u.onerror = done;
        try { speechSynthesis.speak(u); } catch { done(); }
      };
      next();
    });
  },
  stop(){ if (this.ok) try { speechSynthesis.cancel(); } catch {} }
};
const STT = {
  Ctor: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  blocked: false, cur: null,
  get ok(){ return !!this.Ctor && !this.blocked; },
  listen(onPartial){
    return new Promise((resolve, reject) => {
      let r; try { r = new this.Ctor(); } catch { this.blocked = true; return reject('start'); }
      r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
      let text = '';
      r.onresult = e => { text = Array.from(e.results).map(x => x[0].transcript).join(' '); onPartial && onPartial(text); };
      r.onerror = e => { if (e.error === 'no-speech' || e.error === 'aborted') return; if (['not-allowed','service-not-allowed','audio-capture'].includes(e.error)) this.blocked = true; reject(e.error); };
      r.onend = () => { this.cur = null; resolve(text.trim()); };
      try { r.start(); this.cur = r; } catch { this.blocked = true; reject('start'); }
    });
  },

/* Nota de pronúncia: compara o que foi dito (ou ditado) com a frase-alvo, palavra por palavra */
const CONTR = {"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","what's":"what is","where's":"where is","that's":"that is","there's":"there is","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","i'd":"i would","i'll":"i will","let's":"let us","i've":"i have","you've":"you have","we've":"we have","couldn't":"could not","wouldn't":"would not","haven't":"have not","hasn't":"has not","how's":"how is","who's":"who is"};
function normWords(s){
  return plain(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[^a-z0-9'\s-]/g,' ').split(/[\s-]+/)
    .map(w => w.replace(/^'+|'+$/g,'')).filter(Boolean).flatMap(w => (CONTR[w]||w).split(' '));
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const sim = (a, b) => 1 - lev(a, b) / Math.max(a.length, b.length, 1);
function scoreSpeech(target, said){
  const tokens = plain(target).split(/\s+/).filter(Boolean);
  const T = [], owner = [];
  tokens.forEach((tok, i) => normWords(tok).forEach(w => { T.push(w); owner.push(i); }));
  const U = normWords(said);
  const n = T.length, m = U.length;
  const dp = Array.from({length:n+1}, () => new Float64Array(m+1));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    const s = sim(T[i-1], U[j-1]); dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1], dp[i-1][j-1] + (s >= .5 ? s : 0));
  }
  const best = new Array(n).fill(0); let i = n, j = m;
  while (i > 0 && j > 0) {
    const s = sim(T[i-1], U[j-1]);
    if (s >= .5 && Math.abs(dp[i][j] - (dp[i-1][j-1] + s)) < 1e-9) { best[i-1] = s; i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  const tokScore = tokens.map(() => 1);
  best.forEach((s, k) => { tokScore[owner[k]] = Math.min(tokScore[owner[k]], s); });
  const words = tokens.map((t, k) => ({t, s: normWords(t).length ? tokScore[k] : 1}));
  const total = words.length || 1;
  const pts = words.reduce((a, w) => a + (w.s >= .99 ? 1 : w.s >= .6 ? .5 : 0), 0);
  return {pct: Math.round(pts / total * 100), words};
}
function scoreHTML(r){
  return `<div class="between"><div class="score">${r.words.map(w => `<span class="${w.s >= .99 ? 'ok' : w.s >= .6 ? 'close' : 'miss'}">${esc(w.t)}</span>`).join('')}</div><div class="pct">${r.pct}<small style="font-size:1rem">%</small></div></div>`;
}

async function blobToB64(b){ return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); }); }
function looseJSON(t){
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b+1)); } catch {} }
  throw {code:'invalid_json'};
}
async function keyCall(prompt, {tier, images, signal}){
  const content = [];
  for (const img of (images||[])) content.push({type:'image', source:{type:'base64', media_type:img.type || 'image/jpeg', data: await blobToB64(img)}});
  content.push({type:'text', text: prompt + '\n\nResponda somente com o objeto JSON.'});
  const model = tier === 'quick' ? (S.profile.modelQuick || 'claude-haiku-5-5') : (S.profile.modelBest || 'claude-sonnet-5-5');
  const headers = {'content-type':'application/json','authorization':'Bearer ' + getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const ws = getWs(); if (ws) headers['anthropic-workspace-id'] = ws;
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal, headers, body: JSON.stringify({model, max_tokens:8000, messages:[{role:'user', content}]})});
  } catch (e) { throw {code: e && e.name === 'AbortError' ? 'cancelled' : 'offline'}; }
  if (!r.ok) {
    let msg = ''; try { msg = ((await r.json()).error || {}).message || ''; } catch {}
    const m = msg.toLowerCase();
    if (/credit|balance|billing/.test(m)) throw {code:'no_credit'};
    if (/workspace/.test(m)) throw {code:'workspace'};
    if (/cors/.test(m)) throw {code:'cors'};
    throw {code: r.status === 429 ? 'rate_limited' : r.status === 401 || r.status === 403 ? 'bad_key' : r.status === 529 || r.status === 503 ? 'overloaded' : 'upstream_error'};
  }
  const d = await r.json();
  trackUsage(model, d.usage);
  return looseJSON((d.content||[]).filter(b => b.type === 'text').map(b => b.text).join(''));
}
const PRICE = {haiku:[0.10, 0.50], sonnet:[2, 10]};
function trackUsage(model, u){
  const day = today(); S.stats.usage = S.stats.usage || {};
  const x = S.stats.usage[day] || (S.stats.usage[day] = {calls:0, usd:0});
  x.calls++;
  if (u) { const pr = /haiku/.test(model) ? PRICE.haiku : PRICE.sonnet; x.usd += (u.input_tokens||0) / 1e6 * pr[0] + (u.output_tokens||0) / 1e6 * pr[1]; }
  persistLocal();
}
function usageSum(days){
  const u = S.stats.usage || {}; const from = addDays(today(), -(days - 1));

}

const Talk = {
  hands:false, empty:0,
  active:false, sit:null, topic:'', turns:[], done:new Set(), stats:null, ctl:null, busy:false, startedAt:0,
  start({sit=null, topic=''}={}){
    this.active = true; this.sit = sit; this.topic = topic; this.turns = []; this.done = new Set();
    this.stats = {sent:0, fixes:0, words:0}; this.startedAt = Date.now();
    go('talk', {}, {force:true}); this.ask(null);
  },
  pause(){ if (this.ctl) this.ctl.abort(); this.busy = false; this.hands = false; STT.stop(); },
  end(){
    if (!this.active) return;
    const mins = Math.max(1, Math.round((Date.now() - this.startedAt) / 60000));
    const title = this.sit ? this.sit.title : (this.topic || 'Conversa livre');
    const missions = this.sit ? `${this.done.size}/${this.sit.m.length} missões` : '';
    const sum = {title, mins, sent:this.stats.sent, fixes:this.stats.fixes, words:this.stats.words, missions};
    if (this.stats.sent) logHistory('conversa', title, `${mins} min · ${this.stats.sent} falas · ${this.stats.fixes} correções${missions ? ' · ' + missions : ''}`, this.stats.sent * 5);
    this.active = false; this.hands = false; STT.stop(); this.turns = []; this.sit = null; this.lastSummary = sum;
    TTS.stop(); go('talk', {}, {force:true});
  },
  prompt(userText){
    const sit = this.sit;
    const hist = this.turns.filter(t => t.role !== 'err').slice(-14).map(t => t.role === 'me' ? `Jorge: ${t.text}` : `Professora: ${plain(t.data?.reply || '')}`).join('\n');
    const scene = sit
      ? `SIMULAÇÃO: ${sit.setting} Você faz o papel de ${sit.role}, falando inglês natural de nível iniciante. Fique no papel na reply; as correções vão só no campo correction. Missões do Jorge (ids): ${sit.m.map(([id, t]) => `${id} = ${t}`).join('; ')}. Missões já cumpridas: ${[...this.done].join(', ') || 'nenhuma'}. Quando todas estiverem cumpridas, encerre a cena com gentileza na reply.`
      : `CONVERSA LIVRE sobre: ${this.topic || 'o que o Jorge quiser'}. Faça uma pergunta por vez, ligada à vida e ao trabalho dele.`;
    const turn = userText == null
      ? 'Comece a conversa agora: cumprimente o Jorge (na simulação, já no papel) e faça a primeira pergunta. correction = null.'
      : `Última fala do Jorge: """${userText}"""\nSe ele escreveu em português, coloque em correction a versão em inglês (wrong = o que ele escreveu, why = "Em inglês fica assim." + dica) e siga a conversa.`;
    return `[[TIPO:CHAT]]
${BASE}
Jeito da professora: ${MODES[S.profile.mode].rule}
${PTMODE[S.profile.pt]}
${learnerCtx()}
${scene}
${hist ? 'Conversa até aqui:\n' + hist : ''}
${turn}
Responda SOMENTE com um objeto JSON, sem texto fora dele:
{"correction": null ou {"wrong":"o que ele disse","right":"forma natural em inglês com ** **","reading":"leitura aproximada","pt":"tradução","why":"motivo em uma frase, em português"},
 "reply":"sua fala em inglês: 1 a 3 frases curtas, terminando com UMA pergunta, com ** ** na sílaba forte",
 "reading":"leitura aproximada da reply",
 "pt":"tradução da reply",
 "tip":"dica curta em português ou string vazia",
 "words":[até 3 itens ${PHRASE_SHAPE} com palavras ou blocos úteis novos],
 "missions_done":[ids das missões cumpridas nesta fala do Jorge]}
Use correction = null quando ele acertar ou quando o erro for mínimo. Pequenos deslizes de pontuação e maiúsculas não contam.`;
  },
  async ask(userText){
    if (this.busy) return;
    this.busy = true; setStage('thinking');
    if (userText != null) { this.turns.push({role:'me', text:userText}); this.stats.sent++; paintLog(); }
    this.ctl = new AbortController();
    try {
      const d = await AI.json(this.prompt(userText), {signal:this.ctl.signal});
      if (!this.active) { this.busy = false; return; }
      const data = {correction: d.correction && d.correction.right ? d.correction : null, reply: String(d.reply||''), reading: String(d.reading||''), pt: String(d.pt||''), tip: String(d.tip||''), words: Array.isArray(d.words) ? d.words.slice(0, 3) : []};
      if (this.sit && Array.isArray(d.missions_done)) d.missions_done.forEach(id => { if (this.sit.m.some(([m]) => m === id)) this.done.add(id); });
      if (data.correction) { this.stats.fixes++; logError(data.correction); }
      this.turns.push({role:'t', data}); this.busy = false;
      if (userText != null) addXP(5); else save();
      paintLog(); paintMissions();
      if (S.profile.autoSpeak && TTS.ok) { setStage('speaking'); await TTS.speak(data.reply); }
      setStage('idle');
      if (this.hands && this.active && route.v === 'talk') talkListen();
    } catch (e) {
      this.busy = false; setStage('idle');
      if (e && e.code === 'cancelled') return;
      this.turns.push({role:'err', e, retry:userText}); paintLog();
    }
  }
};
async function talkListen(){
  const ta = $('#said'), mb = $('#micBtn'); if (!ta || !mb) return;
  if (!STT.ok) { ta.focus(); toast('Use o microfone do teclado'); return; }
  if (Talk.busy || STT.cur) return;
  TTS.stop(); setStage('listening'); mb.classList.add('on');
  try {
    const t = await STT.listen(x => ta.value = x);
    mb.classList.remove('on'); setStage('idle');
    if (t) { Talk.empty = 0; ta.value = ''; Talk.ask(t); }
    else if (Talk.hands && ++Talk.empty >= 2) { Talk.hands = false; paintHands(); toast('Mãos livres pausado: não ouvi nada'); }
    else if (Talk.hands && route.v === 'talk') talkListen();
  } catch {
    mb.classList.remove('on'); setStage('idle');
    if (STT.blocked) { Talk.hands = false; ta.focus(); toast('Microfone bloqueado: libere o microfone para este site ou use o do teclado'); render(); }
  }
}

function repeatBox(slot, target, onPass){
  slot.innerHTML = `<div class="repeat">
    <div class="row">${sayBtns(target)}</div>
    <div class="row" style="flex-wrap:nowrap">${STT.ok ? `<button class="mic" type="button" data-m>${ico('mic')}</button>` : ''}<input type="text" placeholder="Fale ou digite a frase" data-in autocomplete="off" autocapitalize="off"><button class="send" type="button" data-c>${ico('check')}</button></div>
    ${STT.ok ? '' : DICTATE_TIP}
    <div data-out></div></div>`;
  const inp = slot.querySelector('[data-in]'), out = slot.querySelector('[data-out]');
  const check = () => {
    const r = scoreSpeech(target, inp.value); if (!inp.value.trim()) return;
    out.innerHTML = `<div class="stack">${scoreHTML(r)}<p class="small ${r.pct >= 80 ? '' : 'muted'}">${r.pct >= 80 ? 'Muito bem. Frase dentro do padrão.' : 'As palavras em vermelho não apareceram ou saíram diferentes. Ouça na velocidade lenta e repita.'}</p></div>`;
    if (r.pct >= 80 && onPass && !slot.dataset.passed) { slot.dataset.passed = '1'; onPass(); }
  };
  slot.querySelector('[data-c]').onclick = check;
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
  const m = slot.querySelector('[data-m]');
  if (m) m.onclick = async () => {
    m.classList.add('on');
    try { inp.value = await STT.listen(t => inp.value = t); check(); }
    catch { if (STT.blocked) { m.remove(); slot.querySelector('.repeat').insertAdjacentHTML('beforeend', DICTATE_TIP); inp.focus(); } }
    m.classList.remove('on');
  };
}

    $('#prodGo').onclick = () => checkWithTeacher($('#prodIn').value, pr.task, $('#prodOut'));
  } else if (step === 'shadow') {
    sb.innerHTML = `<p class="muted">Ouça, pause e repita imitando ritmo e entonação. Depois fale a frase inteira para ver a nota.</p>
      ${(d.shadow||[]).map((x, i) => `<section class="card stack">${ph(x, {size:'l'})}<p class="small muted">Em blocos: ${chunksOf(x.en).map(c => `<button class="chip" data-say="${enc(c)}" data-slow="1">${esc(c)}</button>`).join(' ')}</p><div data-rs="${i}"></div></section>`).join('')}

function chunksOf(s){
  const words = plain(s).split(/\s+/); const out = []; let cur = [];
  words.forEach(w => { cur.push(w); if (cur.length >= 3 && (/[,.;?!]$/.test(w) || cur.length >= 4)) { out.push(cur.join(' ')); cur = []; } });
  if (cur.length) { if (cur.length === 1 && out.length) out[out.length-1] += ' ' + cur[0]; else out.push(cur.join(' ')); }
  return out;
}
/* Exercícios: múltipla escolha, montar frase e tradução */
function runPractice(host, items, onFinish, finishLabel='Concluir'){
  let i = 0; const res = [];
  const draw = () => {
    if (i >= items.length) {
      const ok = res.filter(Boolean).length;
      host.innerHTML = `<section class="card stack"><p class="eyebrow">Resultado</p><p class="pct">${ok}/${items.length}</p><p class="muted">${ok === items.length ? 'Tudo certo.' : 'As que você errou viraram cartões na Revisão.'}</p><button class="btn primary block" id="pFin">${esc(finishLabel)}</button><button class="btn ghost" id="pAgain">Refazer</button></section>`;
      $('#pFin', host).onclick = onFinish; $('#pAgain', host).onclick = () => { i = 0; res.length = 0; draw(); };
      return;
    }
    const q = items[i];
    host.innerHTML = `<div class="progress-line">${items.map((_, k) => `<i class="${k < i ? (res[k] ? 'ok' : 'bad') : k === i ? 'cur' : ''}"></i>`).join('')}</div><section class="q" id="qq"></section>`;
    const el = $('#qq', host);
    const finish = (ok, rightEn, rightPt) => {
      res[i] = ok;
      if (!ok && rightEn) { addCard({en:rightEn, reading:'', pt:rightPt||''}, 'exercício'); }
      if (ok) addXP(3); else save();
      el.insertAdjacentHTML('beforeend', `<div class="feedback ${ok ? 'good' : 'bad'}"><b>${ok ? 'Certo.' : 'Quase.'}</b>${!ok && rightEn ? `<span>Resposta: <b>${md(rightEn)}</b></span>` : ''}${q.why ? `<span>${md(q.why)}</span>` : ''}${rightEn ? sayBtns(rightEn, false) : ''}</div><button class="btn primary block" id="qNext">Próxima</button>`);
      $('#qNext', host).onclick = () => { i++; draw(); };
    };
    if (q.type === 'choice') {
      el.innerHTML = `<p class="eyebrow">${esc(q.ask || 'Escolha')}</p><h3>${md(q.prompt)}</h3><div class="opts">${(q.options||[]).map((o, k) => `<button data-o="${k}">${md(o)}</button>`).join('')}</div>`;
      $$('[data-o]', el).forEach(b => b.onclick = () => {
        const k = +b.dataset.o; const ans = +q.answer;
        $$('[data-o]', el).forEach(x => { x.disabled = true; if (+x.dataset.o === ans) x.classList.add('right'); });
        if (k !== ans) b.classList.add('wrong');
        const full = String(q.prompt||'').replace(/_{2,}/, plain(q.options[ans]||''));
        finish(k === ans, full, '');
      });
    } else if (q.type === 'order') {
      const words = plain(q.answer).split(/\s+/); let picked = [];
      el.innerHTML = `<p class="eyebrow">${esc(q.ask || 'Monte a frase')}</p>${q.pt ? `<h3>${md(q.pt)}</h3>` : ''}<div class="tiles" id="built"></div><div class="tiles" id="pool" style="border-style:solid"></div><button class="btn primary" id="oCheck">Conferir</button>`;
      const pool = shuffle(words.map((w, k) => ({w, k})));
      const paint = () => {
        $('#built', el).innerHTML = picked.map((p, n) => `<button data-b="${n}">${esc(p.w)}</button>`).join('');
        $('#pool', el).innerHTML = pool.filter(p => !picked.includes(p)).map(p => `<button data-p="${p.k}">${esc(p.w)}</button>`).join('');
        $$('[data-b]', el).forEach(b => b.onclick = () => { picked.splice(+b.dataset.b, 1); paint(); });
        $$('[data-p]', el).forEach(b => b.onclick = () => { picked.push(pool.find(p => p.k === +b.dataset.p)); paint(); });
      };
      paint();
      $('#oCheck', el).onclick = () => { if (!picked.length) return; $('#oCheck', el).remove(); const ok = normWords(picked.map(p => p.w).join(' ')).join(' ') === normWords(q.answer).join(' '); $$('button', $('#built', el)).concat($$('button', $('#pool', el))).forEach(b => b.disabled = true); finish(ok, q.answer, q.pt); };
    } else {
      el.innerHTML = `<p class="eyebrow">${esc(q.ask || 'Traduza')}</p><h3>${md(q.pt)}</h3><input type="text" id="tIn" placeholder="Escreva em inglês" autocomplete="off" autocapitalize="sentences"><button class="btn primary" id="tCheck">Conferir</button>`;
      const go2 = () => {
        const v = $('#tIn', el).value.trim(); if (!v) return;
        const accepts = [q.answer, ...(q.accept||[])];
        const best = Math.max(...accepts.map(a => scoreSpeech(a, v).pct));
        $('#tCheck', el).remove(); $('#tIn', el).disabled = true;
        finish(best >= 90, q.answer, q.pt);
        if (best < 90 && AI.mode !== 'none') {
          el.insertAdjacentHTML('beforeend', `<button class="btn sm" id="askT">A minha resposta também está certa? Perguntar à professora</button><div id="askOut"></div>`);
          $('#askT', el).onclick = () => { $('#askT', el).remove(); checkWithTeacher(v, `Traduzir para o inglês: "${q.pt}" (resposta esperada: ${plain(q.answer)})`, $('#askOut', el), ok => { if (ok) { res[i] = true; } }); };
        }
      };
      $('#tCheck', el).onclick = go2; $('#tIn', el).onkeydown = e => { if (e.key === 'Enter') go2(); };
    }
  };
  draw();
}
async function checkWithTeacher(text, task, out, cb){

  out.innerHTML = `<div class="loading"><div class="spin"></div><p class="small muted">A professora está lendo…</p></div>`;
  const prompt = `[[TIPO:CHECK]]
${BASE}

${learnerCtx()}
Tarefa: ${task}
O Jorge escreveu: """${text}"""
Avalie. Responda SOMENTE com JSON:
{"ok":true ou false (true se estiver correto e natural, mesmo que diferente do modelo),
 "right":"versão correta e natural em inglês com ** ** (igual à dele se já estiver certa)","reading":"leitura aproximada","pt":"tradução",
 "why":"o que mudou e por quê, em português, curto (ou o que ele acertou)",

    cb && cb(!!d.ok);
  } catch (e) { out.innerHTML = errBox(e, () => checkWithTeacher(text, task, out, cb)); }
}

    $('#pnext').onclick = () => { cur = pickFrom(curCat); paint(); };
  };
  let curCat = null;
  const pickFrom = c => { const pool = c === '__cards' ? Object.values(S.cards) : PHRASES.filter(p => !c || p.c === c); return pool[Math.floor(Math.random() * pool.length)] || PHRASES[0]; };

async function downscale(file, max=1600){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', .86));
  } catch { return file; }
}

        return;

      b.innerHTML = `<div class="row"><span class="small muted">Você é <b>${esc(me)}</b> · fala ${k+1} de ${d.lines.length}</span></div><div class="card stack"><p class="eyebrow">Sua fala em português</p><h3>${md(l.pt)}</h3><button class="btn sm ghost" id="eHint">Mostrar em inglês</button><div id="eHintBox" hidden>${ph(l)}</div><div id="eRep"></div></div><button class="btn primary" id="eNext">Próxima fala</button>`;

    };

  }
}

  bindKeySetup(); bindInstall();
  $('#bCopy').onclick = () => copyText(JSON.stringify(compact(S)));
  $('#bRest').onclick = () => sheet(`<h3>Restaurar backup</h3><p class="small muted">Cole aqui o texto copiado em "Copiar backup". O progresso atual será substituído.</p><textarea id="rTxt"></textarea><div class="row"><button class="btn primary" id="rGo">Restaurar</button><button class="btn" data-close>Cancelar</button></div>`, (el, close) => {
    el.querySelector('#rGo').onclick = () => { try { const d = JSON.parse(el.querySelector('#rTxt').value); if (!d.profile || !d.cards) throw 0; S = merge(defaults(), d); save(); close(); toast('Backup restaurado'); render(); } catch { toast('Texto de backup inválido'); } };
  });
  $('#bReset').onclick = () => confirmSheet('Apagar todo o progresso? Cartões, erros e histórico serão perdidos.', 'Apagar', () => { const name = S.profile.name; S = defaults(); S.profile.name = name; STARTER.forEach(p => addCard(p, 'inicial')); S.seeded = true; save(); toast('Progresso apagado'); render(); });
};

/* ============================================================
   Início
   ============================================================ */
TTS.init();
render();
AI.init().then(() => { if (['home','talk','lesson','photo','dialog','weekly','settings','situations'].includes(route.v)) render(); });
Sync.init();
</script>
